name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          grep -E '^e: |error:|What went wrong' -A3 build.log | head -80 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AudiRead-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AudiRead-debug
          path: AudiRead-*.apk

      - name: Publish pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AudiRead build ${{ github.run_number }}
          prerelease: true
          files: AudiRead-*.apk
